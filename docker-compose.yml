version: '3.9'

services:
  # Servidor backend simple
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: proxy-cache-backend
    ports:
      - "5000:5000"
    networks:
      - proxy-net
    restart: unless-stopped

  # Proxy HTTP con caché
  proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    container_name: proxy-cache-proxy
    ports:
      - "8888:8888"
    depends_on:
      - backend
    networks:
      - proxy-net
    restart: unless-stopped
    environment:
      BACKEND_URL: "http://backend:5000"

networks:
  proxy-net:
    driver: bridge
